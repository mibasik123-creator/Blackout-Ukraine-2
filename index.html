<style id="ec">
/* ===== BLACKOUT UKRAINE · ENERGY COMMAND · design system ===== */
:root,:root[data-theme="dark"]{--bg:#0B1117;--bg2:#101A21;--surf:#17242D;--elev:#1D2D37;--card:#17242D;--em:#35D6A0;--cy:#39C6E6;--bl:#4285F4;--t1:#F1F5F4;--t2:#A5B4BC;--t3:#71828C;--ok:#35D6A0;--warn:#FFB547;--bad:#FF5C65;--off:#65737C;--ac:#35D6A0;--tx:#F1F5F4;--mut:#A5B4BC;--bd:rgba(165,180,188,.16);--glass:rgba(16,26,33,.74);--on-em:#04221A;--sh:0 12px 28px -14px rgba(0,0,0,.7);--glow:rgba(var(--emrgb),.35);--r:20px;--r2:14px;--fs:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
:root[data-theme="light"]{--bg:#EEF3F5;--bg2:#E6EDF0;--surf:#FFFFFF;--elev:#F3F7F9;--card:#FFFFFF;--em:#0E9F6E;--cy:#0891B2;--bl:#2F6FDB;--t1:#10202B;--t2:#4A5D69;--t3:#7B8C96;--ok:#0E9F6E;--warn:#B86E00;--bad:#D6404A;--off:#8A98A1;--ac:#0E9F6E;--tx:#10202B;--mut:#5E7280;--bd:rgba(16,32,43,.13);--glass:rgba(255,255,255,.8);--on-em:#fff;--sh:0 10px 24px -14px rgba(16,32,43,.25);--glow:rgba(14,159,110,.25);color-scheme:light}
html,body{overflow-x:hidden}
body{font-family:var(--fs);font-size:15px;line-height:1.4;background:var(--bg);color:var(--t1);background-image:radial-gradient(120% 60% at 50% -10%,rgba(var(--emrgb),.10),transparent 60%);background-attachment:scroll;background-repeat:no-repeat;-webkit-font-smoothing:antialiased;padding-bottom:118px}
:root[data-theme="light"] body{background-image:radial-gradient(120% 60% at 50% -10%,rgba(14,159,110,.08),transparent 60%)}
body::before{display:none;animation:none}
main{max-width:560px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;overflow-x:clip}
.tm,.pt,.stats b,.kv b,.gp,#rt,.cmdv,.chip,.t b{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
/* cards */
.card{background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,0) 60%),var(--surf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:12px}
:root[data-theme="light"] .card{background:var(--surf)}
.card h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--t3);margin:0 0 12px}
.card h2::before{width:3px;height:12px;border-radius:2px;background:var(--em)}
.kv{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:14px}
:root[data-theme="light"] .kv{background:var(--elev)}
.kv span{color:var(--t2)}.kv b{font-weight:700}
.mut{color:var(--t3)}
.bar{height:8px;background:var(--bg2);border:1px solid var(--bd);border-radius:6px}
/* inputs */
select,input,textarea{background:var(--bg2);color:var(--t1);border:1px solid var(--bd);border-radius:12px;font-family:var(--fs);transition:border-color .2s,box-shadow .2s}
:root[data-theme="light"] select,:root[data-theme="light"] input,:root[data-theme="light"] textarea{background:var(--elev)}
select:focus,input:focus,textarea:focus{outline:0;border-color:var(--em);box-shadow:0 0 0 3px var(--glow)}
label{color:var(--t3);font-size:12px;font-weight:500}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:46px!important;height:28px;padding:0;border-radius:14px;position:relative;background:var(--bg2);border:1px solid var(--bd);flex:0 0 46px;cursor:pointer}
input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--t3);transition:transform .2s,background .2s}
input[type=checkbox]:checked{background:rgba(var(--emrgb),.18);border-color:var(--em)}input[type=checkbox]:checked::after{transform:translateX(18px);background:var(--em)}
/* buttons */
button{font-family:var(--fs);font-weight:700;border-radius:14px;color:var(--on-em)}
button:not(.sec):not(.stop):not(.go):not(.pw):not(.sm),button.go{background:linear-gradient(135deg,var(--em),#27B98A)!important;color:var(--on-em);box-shadow:0 6px 16px -8px var(--glow)!important}
button.sec{background:var(--elev)!important;color:var(--t1);border:1px solid var(--bd);box-shadow:none}
button.stop{background:linear-gradient(135deg,#FF6B73,#E84853)!important;color:#fff;box-shadow:0 6px 16px -8px rgba(255,92,101,.5)!important}
button.sm{border-radius:10px}
.chips button.on{background:rgba(var(--emrgb),.16)!important;color:var(--em);border-color:var(--em)}
.h .sec.sm{color:var(--bad);border-color:rgba(255,92,101,.3)}
/* header */
.hero{padding:4px 2px 14px}.hero .hi{color:var(--t3);font-size:13px;font-weight:500}
.hero .ttl{font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--t1);background:none;-webkit-text-fill-color:currentColor;animation:none;margin:2px 0 0;display:flex;align-items:center;gap:10px}
.hero .ttl svg{width:26px;height:26px;color:var(--em);flex:0 0 auto}
.ech{display:flex;align-items:center;gap:12px;padding:2px 54px 14px 2px}
.ech .lg{width:44px;height:44px;flex:0 0 44px;filter:drop-shadow(0 0 10px var(--glow))}
.ech .wm{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--t3)}
.ech .nm{font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.ech .hi{font-size:12px;color:var(--t3);margin-top:2px}
#gear{width:42px;height:42px;background:var(--glass)!important;border:1px solid var(--bd);color:var(--t2);box-shadow:none!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#gear svg{width:22px;height:22px}#gear.on{color:var(--em);border-color:var(--em)}
/* status chips */
.chip,.pill{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.06em;padding:5px 10px;border-radius:999px;background:rgba(101,115,124,.14);border:1px solid rgba(101,115,124,.35);color:var(--t2);text-transform:none}
.chip i,.pill i{width:7px;height:7px;border-radius:50%;background:var(--off);animation:none}
.chip.on,.pill.on{background:rgba(var(--emrgb),.12);border-color:rgba(var(--emrgb),.45);color:var(--em)}
.chip.on i,.pill.on i{background:var(--em);animation:dot 1.8s ease-out infinite}
.chip.warn{background:rgba(255,181,71,.12);border-color:rgba(255,181,71,.45);color:var(--warn)}.chip.warn i{background:var(--warn);animation:dotw 1.4s ease-out infinite}
.chip.bad{background:rgba(255,92,101,.12);border-color:rgba(255,92,101,.45);color:var(--bad)}.chip.bad i{background:var(--bad)}
@keyframes dot{0%{box-shadow:0 0 0 0 rgba(var(--emrgb),.55)}100%{box-shadow:0 0 0 8px rgba(var(--emrgb),0)}}
@keyframes dotw{0%{box-shadow:0 0 0 0 rgba(255,181,71,.55)}100%{box-shadow:0 0 0 8px rgba(255,181,71,0)}}
/* location row */
.locrow select{background:var(--surf)}.locrow .gb2{background:var(--surf)!important;color:var(--t2);border:1px solid var(--bd)}.locrow .gb2 svg{width:20px;height:20px}
/* command core */
.cmd{display:flex;gap:16px;align-items:center}
.cmdg{position:relative;width:132px;height:132px;flex:0 0 132px}
.cmdg svg{width:100%;height:100%;transform:rotate(-90deg)}
.cmdg .tk{fill:none;stroke:var(--bg2);stroke-width:9}:root[data-theme="light"] .cmdg .tk{stroke:var(--elev)}
.cmdg .pg{fill:none;stroke:url(#ec-g);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.cmdg .ct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cmdv{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}.cmdv small{font-size:13px;font-weight:600;color:var(--t3);margin-left:2px}
.cmdl{font-size:9px;letter-spacing:.08em;max-width:84px;line-height:1.2;text-transform:uppercase;color:var(--t3);margin-top:6px;font-weight:700}
.cmds{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.cmds div{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--t2)}
.cmds b{font-weight:600;color:var(--t1);font-variant-numeric:tabular-nums}
.cmds .chip{padding:3px 8px;font-size:10px}
/* metric tiles */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--surf);border:1px solid var(--bd);border-radius:16px;padding:12px 6px 10px;text-align:center;box-shadow:var(--sh);display:flex;flex-direction:column;gap:3px}
.stats b{font-size:21px;font-weight:700;letter-spacing:-.02em;order:1;color:var(--t1)}.stats span{order:2;font-size:10.5px;color:var(--t3);line-height:1.2;font-weight:500}
/* equipment cards */
.pc{background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,0) 60%),var(--surf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:16px;gap:16px}
:root[data-theme="light"] .pc{background:var(--surf)}
.pc.on{border-color:rgba(var(--emrgb),.55);box-shadow:var(--sh),0 0 0 1px rgba(var(--emrgb),.12),0 0 28px -10px var(--glow)}
.pw{background:var(--elev)!important;color:var(--t3);border:1px solid var(--bd);box-shadow:none!important}
.pw.on{background:linear-gradient(145deg,var(--em),#1FA97F)!important;color:var(--on-em);border-color:transparent;box-shadow:0 8px 22px -8px var(--glow)!important;animation:none}
.pw .ring{border-color:var(--em)}
.gb{stroke:var(--bg2)}.gf{stroke:var(--cy)}
.pn{font-size:15px;font-weight:700}.pt{font-size:26px;font-weight:700;letter-spacing:-.02em}
.pi .chip{margin:3px 0 4px}
/* nav */
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--glass);border:1px solid var(--bd);border-radius:26px;-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 14px 34px -12px rgba(0,0,0,.7)}
#nb button{position:relative;color:var(--t3);font-size:10.5px;font-weight:600;gap:4px;padding:11px 0 10px;border:0}
#nb button i{display:flex;font-size:0;line-height:0}#nb button i svg{width:22px;height:22px}
#nb button.on{color:var(--em)}
#nb button.on:not(.cn)::before{content:"";position:absolute;inset:4px 4px;border-radius:18px;background:rgba(var(--emrgb),.11);animation:nin .28s cubic-bezier(.2,.8,.2,1) both;z-index:-1}
@keyframes nin{from{opacity:0;transform:scale(.7)}}
#nb button.cn{flex:0 0 68px;height:68px;margin:-26px 6px 2px;border-radius:50%;color:var(--on-em);background:linear-gradient(145deg,var(--em),var(--cy))!important;box-shadow:0 10px 24px -8px var(--glow),0 0 0 5px var(--bg)!important;overflow:visible;font-size:0;padding:0}
#nb button.cn i svg{width:30px;height:30px}
#nb button.cn.on{outline:0;box-shadow:0 10px 26px -6px var(--glow),0 0 0 5px var(--bg),0 0 0 6.5px rgba(var(--emrgb),.45)!important}
#nb button.cn.run::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--em);opacity:0;animation:rg 2s ease-out infinite}
body.kb nav{display:none}body.kb{padding-bottom:24px}
/* flow */
.flow svg{width:100%;height:auto;display:block;overflow:visible}.flow text{fill:var(--t2);font-family:var(--fs);font-size:11px;font-weight:600;text-anchor:middle}
.flow .box{fill:var(--bg2);stroke:var(--bd);stroke-width:1.5}:root[data-theme="light"] .flow .box{fill:var(--elev)}
.flow .nd .ic{color:var(--t3)}.flow .nd.e .ic{color:var(--em)}.flow .nd.c .ic{color:var(--cy)}.flow .nd.w .ic{color:var(--warn)}
.flow .nd.e .box{stroke:var(--em)}.flow .nd.c .box{stroke:var(--cy)}.flow .nd.w .box{stroke:var(--warn)}
.flow .nd.e .box,.flow .nd.c .box,.flow .nd.w .box{filter:drop-shadow(0 0 6px var(--glow))}
.flow .pipe{stroke:var(--bd);stroke-width:3;stroke-dasharray:none}
.flow .pipe.dim{stroke-dasharray:2 7}
.flow .cur{stroke:var(--em);stroke-width:3;stroke-dasharray:5 9;filter:none;animation:cur 1s linear infinite}.flow .cur.c{stroke:var(--cy)}
.flow .pt{fill:var(--em)}.flow .pt.c{fill:var(--cy)}
.flow .drop{fill:var(--warn)}
.flow .val{fill:var(--t1);font-size:12px;font-weight:700}
.flow .cap{fill:var(--t3);font-size:10px;font-weight:600}
/* history timeline */
.card .h{position:relative;padding:12px 4px 12px 24px;border-bottom:0;font-size:13.5px;color:var(--t1)}
.card .h::before{content:"";position:absolute;left:5px;top:18px;width:9px;height:9px;border-radius:50%;background:var(--t3);box-shadow:0 0 0 3px var(--bg2)}
.card .h:not(:last-of-type)::after{content:"";position:absolute;left:9px;top:30px;bottom:-6px;width:1px;background:var(--bd)}
.h.k-s::before{background:var(--em)}.h.k-l::before{background:var(--cy)}.h.k-f::before{background:var(--warn)}
/* bluetooth */
.rad{position:absolute;inset:6px;border-radius:50%;border:2px solid var(--cy);opacity:0;pointer-events:none}.rad::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--cy);opacity:0}
.rad.busy{animation:rad 1.6s ease-out infinite}.rad.busy::after{animation:rad 1.6s ease-out .5s infinite}
@keyframes rad{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.5);opacity:0}}
/* loading + splash */
#boot{height:180px;border-radius:var(--r);border:1px solid var(--bd);color:transparent;background:linear-gradient(100deg,var(--surf) 30%,var(--elev) 50%,var(--surf) 70%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
#spl{flex-direction:column;gap:16px;background:var(--bg);font-size:0;animation:spl .45s ease .85s forwards}
#spl .sl{width:92px;height:92px;filter:drop-shadow(0 0 22px var(--glow));animation:bolt .8s cubic-bezier(.3,1.3,.5,1)}
#spl b{font-size:13px;letter-spacing:.32em;font-weight:700;color:var(--t2);animation:fi .8s ease .15s both}
#spl u{display:block;width:96px;height:2px;border-radius:2px;background:var(--bd);overflow:hidden;position:relative}#spl u::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--em),transparent);animation:ld .9s ease-in-out infinite}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(100%)}}@keyframes fi{from{opacity:0;transform:translateY(6px)}}
/* misc */
#toast{background:var(--elev);color:var(--t1);border:1px solid var(--bd)}
.mb{background:var(--surf);border:1px solid var(--bd);border-radius:22px}
#md{background:rgba(5,9,12,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
details.card summary{font-weight:700;color:var(--t1)}
.hero+.card,.hero+.pc{margin-top:0}
main.anim>*{animation-duration:.4s}
@media (min-width:760px){main{max-width:720px}nav{left:50%;right:auto;width:580px;margin-left:-290px}.stats{gap:12px}}
@media (max-width:340px){.cmdg{width:108px;height:108px;flex-basis:108px}.cmdv{font-size:24px}.stats b{font-size:18px}}
@media (prefers-reduced-motion:reduce){#spl{display:none}*,*::before,*::after{animation:none!important;transition:none!important}}

/* =====================================================================
   BLACKOUT 4.0 — Telemetry Store, Data Validation, Energy Balance Engine
   Pure logic: no DOM access. One computed result feeds every UI part.
   ===================================================================== */
var BO_LIMITS={station:15000,grid:30000,gen:30000,car:120000,home:30000};
var BO_STATION_AC_MAX_W=2400;   /* Fossibot F2400 rated AC output; used only to flag overload, never to block charging */
var BO_MIN_FLOW_W=5;            /* below this a flow is treated as zero */

/* ---------- Telemetry Store ----------
   Keeps the last sample per source with the time it was RECEIVED. Rendering never touches timestamps. */
function TelemetryStore(){this.d={};this.subs=[]}
TelemetryStore.prototype.set=function(k,sample,now){var v={},key;for(key in sample)if(Object.prototype.hasOwnProperty.call(sample,key))v[key]=sample[key];
 v.t=(typeof sample.t==='number')?sample.t:(now!=null?now:Date.now());if(v.link==null)v.link=true;this.d[k]=v;this.emit(k)};
TelemetryStore.prototype.markOffline=function(k){if(this.d[k]){this.d[k].link=false;this.emit(k)}else{this.d[k]={link:false,t:null};this.emit(k)}};
TelemetryStore.prototype.get=function(k){return this.d[k]};
TelemetryStore.prototype.clear=function(){this.d={};this.emit('*')};
TelemetryStore.prototype.on=function(f){this.subs.push(f)};
TelemetryStore.prototype.emit=function(k){for(var i=0;i<this.subs.length;i++){try{this.subs[i](k)}catch(e){}}};
TelemetryStore.prototype.snapshot=function(){var o={},k;for(k in this.d)o[k]=this.d[k];return o};

/* ONLINE: fresh data; OFFLINE: link lost (explicit); STALE: data older than its limit; UNKNOWN: never received */
function sourceState(sample,limit,now){if(!sample)return 'UNKNOWN';if(sample.link===false)return 'OFFLINE';if(typeof sample.t!=='number')return 'UNKNOWN';if(now-sample.t>limit)return 'STALE';return 'ONLINE'}

/* ---------- Data Validation ---------- */
function num_(v){return (typeof v==='number'&&isFinite(v))?v:null}
function validate(raw){var issues=[],out={};
 function W(src,field,v){var n=num_(v);if(v!=null&&n==null){issues.push({level:'warn',code:'nan_'+src+'_'+field,text:'некоректне значення '+field+' ('+src+')'});return null}
  if(n!=null&&n<0){issues.push({level:'warn',code:'neg_'+src+'_'+field,text:'від’ємна потужність '+field+' ('+src+') відкинута'});return null}return n}
 function SOC(src,v){var n=num_(v);if(v!=null&&n==null){issues.push({level:'warn',code:'nan_'+src+'_soc',text:'некоректний рівень заряду ('+src+')'});return null}
  if(n==null)return null;if(n<0||n>100){issues.push({level:'error',code:'soc_range_'+src,text:'рівень заряду '+n+'% поза межами 0–100% ('+src+')'});return null}return n}
 var s=raw.station;if(s){out.station={pct:SOC('станція',s.pct),inW:W('станція','вхід',s.inW),outW:W('станція','вихід',s.outW),tf:num_(s.tf),te:num_(s.te),t:s.t,link:s.link};
  if(out.station.tf!=null&&(out.station.tf<0||out.station.tf>6000))out.station.tf=null;if(out.station.te!=null&&(out.station.te<0||out.station.te>200000))out.station.te=null;
  if(BO_STATION_AC_MAX_W&&out.station.outW!=null&&out.station.outW>BO_STATION_AC_MAX_W)issues.push({level:'error',code:'overload',text:'вихід станції '+Math.round(out.station.outW)+' Вт перевищує номінальні '+BO_STATION_AC_MAX_W+' Вт'})}
 var g=raw.grid;if(g){out.grid={on:typeof g.on==='boolean'?g.on:(g.on===1?true:g.on===0?false:null),V:num_(g.V),t:g.t,link:g.link};if(out.grid.on==null)issues.push({level:'warn',code:'grid_state',text:'стан мережі не визначено'})}
 var n=raw.gen;if(n){out.gen={on:typeof n.on==='boolean'?n.on:(n.on===1?true:n.on===0?false:null),fuel:n.fuel==null?null:SOC('бак генератора',n.fuel),t:n.t,link:n.link}}
 var c=raw.car;if(c){out.car={pct:SOC('Tesla',c.pct),kW:c.kW==null?null:W('Tesla','зарядка',c.kW),st:c.st,src:c.src,t:c.t,link:c.link}}
 var h=raw.home;if(h){out.home={W:W('будинок','споживання',h.W),t:h.t,link:h.link}}
 return {data:out,issues:issues}}

/* ---------- Energy Balance Engine ----------
   Physical scheme of this home:
   1) generator may feed the house directly and charge the station at the same time;
   2) grid may feed the house directly and charge the station at the same time;
   3) Tesla charges from the grid only;
   4) the station feeds the house only when no alternative source is CONFIRMED;
   5) there is no station -> Tesla path;
   6) generator + grid both confirmed = source conflict (error), never resolved by priority. */
function computeBalance(raw,now){var V=validate(raw||{}),D=V.data,issues=V.issues.slice(),L=BO_LIMITS,M=BO_MIN_FLOW_W;
 var S={station:sourceState(D.station,L.station,now),grid:sourceState(D.grid,L.grid,now),gen:sourceState(D.gen,L.gen,now),car:sourceState(D.car,L.car,now),home:sourceState(D.home,L.home,now)};
 var st=D.station,gr=D.grid,gn=D.gen,car=D.car,hm=D.home,on=function(k){return S[k]==='ONLINE'};
 var gridOn=on('grid')&&gr.on===true,gridOff=on('grid')&&gr.on===false,genOn=on('gen')&&gn.on===true,genOff=on('gen')&&gn.on===false;
 var stIn=on('station')?st.inW:null,stOut=on('station')?st.outW:null;
 /* --- who feeds the house --- */
 var feed;
 if(genOn&&gridOn){feed='conflict';issues.push({level:'error',code:'conflict',text:'одночасно підтверджені генератор і мережа — перевірте перемикач джерел'})}
 else if(genOn)feed='gen';else if(gridOn)feed='grid';
 else if(on('station')&&stOut!=null&&stOut>M)feed='station';      /* measured output and no confirmed alternative */
 else if(gridOff&&(genOff||S.gen==='UNKNOWN')&&on('station'))feed='none';   /* outage, station idle */
 else feed='unknown';
 if(feed==='station'&&!gridOff)issues.push({level:'warn',code:'grid_unknown',text:'стан мережі невідомий ('+stateUa(S.grid)+') — будинок живиться від станції за її вимірами'});

 var chg=!!(d&&(d.st===4||d.st===5)),pct=d&&d.pct!=null?Math.round(d.pct):null,age=d&&d.t?Math.round((Date.now()-d.t)/60000):null;
 var h='<div class="hero"><div class="hi">'+(TS.on?'Tesla · Bluetooth':'Авто')+'</div><div class="ttl">'+svgi('car',26)+esc(nm)+'</div></div>';
 if(!c.vin)return h+'<div class="card"><div class="mut">Додайте авто: вкажіть VIN нижче — підключення напряму по Bluetooth, без хмари.</div></div>';
 h+='<div class="card" id="carbig"><div class="bo-cpct">'+(pct!=null?pct+'<small>%</small>':'—')+'</div><div class="mut" id="carst">'+
  (chg?'заряджається'+(d.kw!=null?' · '+String(d.kw).replace('.',',')+' кВт':''):pct!=null?'не заряджається':'ще немає даних')+(age!=null&&!TS.on?' · дані '+(age<1?'щойно':age+' хв тому'):'')+'</div>';
 if(c.paired&&TS.on&&d){h+='<div class="row"><button class="'+(chg?'stop':'')+'" onclick="boCarChg('+(chg?0:1)+')"'+(TS.chgBusy||TS.busy?' disabled':'')+'>'+(chg?'Зупинити заряджання':'Почати заряджання')+'</button></div>'}
 else if(c.paired&&!TS.on){h+='<div class="row"><button onclick="tsConnect()"'+(TS.connecting||TS.st==='conn'?' disabled':'')+'>Під’єднати</button></div>'}
 return h+'</div>'}
function boCarChg(on){if(!on&&!confirm('Зупинити заряджання Tesla?'))return;try{tsCharge(!!on)}catch(e){console.error(e)}setTimeout(function(){if(tab==='car')render()},1500)}
function vCar(){var d=document.createElement('div');d.innerHTML=BO_VBT();var ts=d.querySelector('#tscard');if(ts)ts.removeAttribute('hidden');return boCarHero()+(ts?ts.outerHTML:'')}
(function(){var u=tsUi;tsUi=function(){var k=TS.st+'|'+(TS.on?1:0)+'|'+(tsCfg().paired?1:0)+'|'+(TS.err?1:0)+'|'+(TS.chgBusy?1:0)+'|'+(TS.d?TS.d.st+'/'+Math.round(TS.d.pct||0):'');
 if(tab==='car'&&k!==TS.boKey){TS.boKey=k;var y=window.scrollY;try{render()}catch(e){}window.scrollTo(0,y)}u.apply(this,arguments)}})();

try{render()}catch(e){window.__bootCheck&&setTimeout(window.__bootCheck,0);throw e}
try{initNativeApp()}catch(e){console.error('BLACKOUT native init',e)}
try{syncNativeReminders()}catch(e){console.error('BLACKOUT reminders init',e)}
setTimeout(function(){var e=document.getElementById('spl');if(e)e.style.display='none'},2200);
</script>
</body>

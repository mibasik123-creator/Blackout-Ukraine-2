<style>

#nb{display:flex;flex:1;position:relative;z-index:1}#ind{position:absolute;top:5px;bottom:5px;left:0;width:20%;border-radius:16px;background:rgba(232,115,12,.16);transition:transform .45s cubic-bezier(.3,1.35,.5,1)}nav button.on{background:none!important}
.hero .ttl{background-image:linear-gradient(90deg,var(--ac),#f5b400,var(--ac));background-size:200% 100%;animation:sh 5s linear infinite}@keyframes sh{to{background-position:200% 0}}
button:not(.pw){position:relative;overflow:hidden}.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}@keyframes rp{to{transform:scale(1);opacity:0}}

#ind{display:none}nav{overflow:visible}#nb{align-items:flex-end}

#nb button i{font-style:normal;font-size:20px;line-height:1}#nb button.on{color:var(--ac)}

details.card summary{cursor:pointer;font-weight:600}details.card>*:not(summary){margin-top:10px}
#mi{display:none;margin:10px 0 4px;font-size:22px;text-align:center}
.locrow{display:flex;gap:8px;align-items:center;margin:0 0 12px}.locrow select{padding:10px;font-size:14px;flex:1;min-width:0}.locrow .gb2{flex:0 0 46px;width:46px;height:46px;margin:0;padding:0;border-radius:14px;font-size:20px}
#mp{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}#mp.on{display:flex}
#mpt{display:flex;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:var(--card);border-bottom:1px solid var(--bd)}#mpt input{flex:1;min-width:0}#mpt button{width:46px;height:46px;margin:0;padding:0;flex:0 0 46px;border-radius:14px}
#mmap{position:relative;flex:1;overflow:hidden;touch-action:none;background:#cfd8dc}#mtl{position:absolute;inset:0}

#mpin{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:3}#mpin::before{content:"\1F4CD";position:absolute;font-size:38px;line-height:1;transform:translate(-50%,-100%);filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
#mz{position:absolute;right:12px;top:12px;z-index:4;display:flex;flex-direction:column;gap:8px}#mz button{width:44px;height:44px;margin:0;padding:0;border-radius:12px;font-size:22px}

#mpf{padding:12px;background:var(--card);border-top:1px solid var(--bd);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}#mpf .rc{margin:0 0 8px}
#mmsg{position:absolute;left:12px;right:60px;top:12px;z-index:4;background:var(--card);border-radius:12px;padding:10px;font-size:13px;display:none}
.flow svg{width:100%;height:auto;display:block}.flow text{fill:var(--tx);font-size:12px;text-anchor:middle}
.flow .box{fill:var(--bg);stroke:var(--bd);stroke-width:2}.flow .pipe{stroke:var(--bd);stroke-width:4;fill:none;stroke-linecap:round}

/* BLACKOUT 3.0 design system */
:root[data-theme="light"]{--bg:#F2F5F7;--card:#FFFFFF;--tx:#142433;--mut:#718096;--ac:#1769AA;--ok:#159B62;--bad:#D94B4B;--bd:#DCE4E9;color-scheme:light}
:root[data-theme="dark"]{--bg:#101820;--card:#1B2935;--tx:#F4F7FA;--mut:#AAB8C5;--ac:#58A6FF;--ok:#35D58A;--bad:#F05252;--bd:#34424D;color-scheme:dark}
body{background-image:radial-gradient(circle at 12% 0%,rgba(53,213,138,.09),transparent 45%),radial-gradient(circle at 95% 100%,rgba(53,213,138,.05),transparent 42%)}
body::before{background:radial-gradient(circle at 20% 25%,rgba(53,213,138,.08),transparent 40%),radial-gradient(circle at 80% 70%,rgba(53,213,138,.05),transparent 40%)}
.hero .ttl{background-image:linear-gradient(90deg,var(--ac),#76E6B2,var(--ac))}
.card h2::before{background:linear-gradient(var(--ac),#76E6B2)}
button:not(.sec):not(.stop):not(.go):not(.pw):not(.sm){background:linear-gradient(145deg,var(--ac),#16885B);box-shadow:0 4px 14px rgba(21,155,98,.22)}
nav button.on{color:var(--ac)}
nav button.on{background:rgba(53,213,138,.12)!important}
#ind{background:rgba(53,213,138,.12)}
.pw.on{background:linear-gradient(145deg,#35D58A,#159B62)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

<body>
<main id="app"></main>
<nav id="nav"><div id="ind"></div><div id="nb"></div></nav>
<button id="gear" onclick="setTab('set')">⚙</button>
<div id="mp"></div>
<div id="spl"><span>⚡</span></div>
<div id="toast"></div>
<div id="md"><div class="mb"><p id="mt" style="margin:0 0 6px;font-size:17px"></p><input id="mi" type="number" inputmode="decimal"><div class="row"><button class="sec" id="mcn" onclick="askOk(0)">Отмена</button><button class="stop" id="mok" onclick="askOk(1)">Да</button></div></div></div>
<script>
var KEY='blackout_v1',tab='pan';
function def(){return{v:3,gens:[{n:'FORTE FG6500',lph:1.8,svc:50,h:0,last:0}],g:0,run:null,ses:[],sts:[{n:'Fossibot F2400',wh:2048},{n:'Fossibot F1800 (2026)',wh:1536}],logs:[],price:0}}
var S=load();S.theme=S.theme||'dark';S.locs=S.locs||['Дом'];S.users=S.users||['Я'];S.loc=S.loc||0;S.usr=S.usr||0;S.gps=S.gps||{};S.tar=S.tar||0;S.fills=S.fills||[];S.remInt=S.remInt||0;S.rem=S.rem||null;S.srun=S.srun||null;if(!S.lang){S.lang='uk';if(S.locs.length==1&&S.locs[0]=='Дом')S.locs[0]='Дім'}
function migrate(o){if(!o||typeof o!=='object'||!Array.isArray(o.gens)||!o.gens.length||!Array.isArray(o.sts))throw new Error('Невірна структура даних');if(Number(o.v)>3)throw new Error('Версія резервної копії новіша за цей застосунок');o.v=3;o.locs=Array.isArray(o.locs)&&o.locs.length?o.locs:['Дім'];o.users=Array.isArray(o.users)&&o.users.length?o.users:['Я'];o.g=Number.isInteger(o.g)&&o.g>=0&&o.g<o.gens.length?o.g:0;o.loc=Number.isInteger(o.loc)&&o.loc>=0&&o.loc<o.locs.length?o.loc:0;o.usr=Number.isInteger(o.usr)&&o.usr>=0&&o.usr<o.users.length?o.usr:0;o.gps=o.gps&&typeof o.gps==='object'?o.gps:{};o.tar=Number.isFinite(+o.tar)?+o.tar:0;o.price=Number.isFinite(+o.price)?+o.price:0;o.fills=Array.isArray(o.fills)?o.fills:[];o.ses=Array.isArray(o.ses)?o.ses:[];o.logs=Array.isArray(o.logs)?o.logs:[];o.remInt=Number.isFinite(+o.remInt)?+o.remInt:0;o.rem=o.rem&&Number.isFinite(+o.rem.t)?o.rem:null;o.srun=o.srun&&Number.isInteger(o.srun.i)&&o.srun.i>=0&&o.srun.i<o.sts.length&&Number.isFinite(+o.srun.t)?o.srun:null;o.theme=o.theme==='light'?'light':'dark';return o}
function load(){try{var j=localStorage.getItem(KEY);if(j)return migrate(JSON.parse(j))}catch(e){}return def()}
function save(){try{S.v=3;localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){try{toast(e&&e.name==='QuotaExceededError'?'Сховище заповнене. Видаліть зайві фото або експортуйте резервну копію.':'Не вдалося зберегти дані. Експортуйте резервну копію.')}catch(x){}return false}}
function applyTheme(){var t=(S.theme==='light'?'light':'dark');document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='dark'?'#101820':'#F2F5F7')}
function setTheme(v){S.theme=v==='light'?'light':'dark';applyTheme();save();render()}
function esc(s){return String(s).replace(/[&<>\"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]})}
function f1(x){return (Math.round(x*10)/10).toString().replace('.',',')}
function dt(t){return new Date(t).toLocaleString(LOC(),{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function dur(ms){var s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);s%=60;return h+':'+('0'+m).slice(-2)+':'+('0'+s).slice(-2)}
var TABS=['pan','gen','st','hist','bt','set','cat'];var tf=1;function setTab(t){var o=TABS.indexOf(tab),n=TABS.indexOf(t);document.getElementById('app').style.setProperty('--dx',((n>o)-(n<o))*28+'px');tab=t;tf=1;window.scrollTo(0,0);render()}

function fuelLeft(g){var b=0;S.fills.forEach(function(f){if(f.g==g.n)b+=f.l});S.ses.forEach(function(s){if(s.g==g.n)b-=s.f});if(S.run&&S.gens[S.g]==g)b-=(Date.now()-S.run)/3600000*g.lph;return Math.max(0,b)}
function fuelCap(g){var m=0;S.fills.forEach(function(f){if(f.g==g.n)m=Math.max(m,f.l)});return Math.max(m,fuelLeft(g),1)}
function flowAct(k){if(k=='tank')askNum('Залито топлива, л',function(v){if(!(v>0))return toast('Введите литры');S.fills.push({id:Date.now(),t:Date.now(),l:v,g:S.gens[S.g].n});save();render();toast('Заправка записана')});else if(k=='plug')askNum('Тариф электроэнергии, грн/кВт·ч (0 — не считать)',function(v){S.tar=Math.max(0,v);save();render();toast('Тариф сохранён')});else if(k=='gen'){if(S.run)stopG();else startG()}else if(k=='st'){if(!S.sts[si])return toast('Добавьте станцию в каталоге');if(S.srun)stStop();else stStart()}else if(k=='home')setTab('hist')}
function flowNode(k,x,dy,ico,sub,lab,l,col){var y=40+dy,w=70,hh=76,id='c'+x+'_'+dy,fy=y+hh*(1-l),cx=x+w/2;
 return '<g class="nd" role="button" tabindex="0" aria-label="'+esc(lab)+'" onclick="flowAct(&quot;'+k+'&quot;)" onkeydown="if(event.key===&quot;Enter&quot;||event.key===&quot; &quot;){event.preventDefault();flowAct(&quot;'+k+'&quot;)}"><defs><clipPath id="'+id+'"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+hh+'" rx="14"/></clipPath></defs><rect class="box" x="'+x+'" y="'+y+'" width="'+w+'" height="'+hh+'" rx="14" style="stroke:'+col+'"/>'+(l>0?'<rect clip-path="url(#'+id+')" x="'+x+'" y="'+fy+'" width="'+w+'" height="'+(hh*l)+'" fill="#2e8b57" opacity=".35" style="transition:y 1s,height 1s"/>':'')+ico.replace(/CX/g,cx).replace(/IY/g,y+(sub?44:52))+(sub?sub.replace(/CX/g,cx).replace(/SY/g,y+66):'')+'<text x="'+cx+'" y="'+(y+hh+18)+'">'+esc(lab)+'</text></g>'}
function flowCard(lvl,g){var r=S.run,sr=S.srun,sn=S.sts[sr?sr.i:si],l=Math.max(0,Math.min(1,(lvl||0)/100)),H=250,A=18,B=135,C=252,s='<svg viewBox="0 0 340 '+H+'" role="group" aria-label="Схема потоків енергії">',snm=sn?String(sn.n).split(' ').slice(-1)[0]:'—',gn=g?String(g.n).split(' ').slice(-1)[0]:'',pc=lvl==null?'—':Math.round(lvl)+'%',ok='var(--ok)',bd='var(--bd)';
 var wave='M-60 4 q15 -8 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 V130 H-60Z';
 function bolt(x,y){return '<text class="bolt" x="'+x+'" y="'+y+'" style="font-size:16px">⚡</text>'}
 function line(d,on,bx,by){return on?'<path class="cur" d="'+d+'"/>'+bolt(bx,by):'<path class="pipe" d="'+d+'"/>'}
 var b=fuelLeft(g),cap=fuelCap(g),lv=S.fills.length?Math.max(.04,Math.min(1,b/cap)):(r?.6:0);
 s+='<defs><clipPath id="tc"><rect x="'+A+'" y="40" width="70" height="76" rx="14"/></clipPath></defs><g class="nd" onclick="flowAct(\'tank\')"><rect class="box" x="'+A+'" y="40" width="70" height="76" rx="14"/><g clip-path="url(#tc)"><g id="flq" style="transform:translateY('+(40+76*(1-lv))+'px);transition:transform 1s linear"><path class="wv" d="'+wave+'" fill="#f5a000" opacity=".9"/></g></g><text x="53" y="84" style="font-size:30px">⛽</text><text id="flt" x="53" y="106" style="font-size:12px;font-weight:700">'+(S.fills.length?f1(b)+' л':'—')+'</text><text x="53" y="134">Бак</text></g>';
 s+='<path class="pipe" d="M88 78 H135"/>';
 if(r)s+='<circle class="drop" cx="92" cy="78" r="3.5"/><circle class="drop" cx="92" cy="78" r="3.5" style="animation-delay:.37s"/><circle class="drop" cx="92" cy="78" r="3.5" style="animation-delay:.74s"/>';
 s+=flowNode('gen',B,0,'<text'+(r?' class="spin"':'')+' x="CX" y="IY" style="font-size:32px;'+(r?'':'opacity:.45')+'">⚙</text>','',gn,0,r?ok:bd);
 s+=line('M205 78 H228 V113 H252',r,216,70);
 s+=flowNode('plug',A,100,'<text x="CX" y="IY" style="font-size:30px">🔌</text>','','Сеть',0,bd)+line('M88 178 H135',sr,104,170);
 s+=flowNode('st',B,100,'<text x="CX" y="IY" style="font-size:30px;'+(sr?'':'opacity:.45')+'">🔋</text>','<text x="CX" y="SY" style="font-size:12px;font-weight:700">'+pc+'</text>',snm,l,sr?ok:bd);
 s+=line('M205 178 H228 V143 H252',sr,216,170);
 s+=flowNode('home',C,50,'<text x="CX" y="IY" style="font-size:30px">🏠</text>','','Нагрузка',0,bd);
 s+='</svg>';
 var cap2=r?'<div class="mut" id="flr" style="text-align:center">'+('⛽ −'+f1(g.lph)+' л/ч'+(S.fills.length?' · ~'+f1(fuelLeft(g)/(g.lph||1))+' ч':''))+'</div>':'';
 return '<div class="card flow"><h2>Потоки энергии</h2>'+s+cap2+'<div class="mut" style="text-align:center;font-size:11px;margin-top:4px">Нажмите на значок: вкл/выкл, заправка, тариф</div></div>'}
function flowTick(){var q=document.getElementById('flq');if(!q||!S.run)return;var g=S.gens[S.g],b=fuelLeft(g),cap=fuelCap(g),lv=S.fills.length?Math.max(.04,Math.min(1,b/cap)):.6,t=document.getElementById('flt'),r=document.getElementById('flr');q.style.transform='translateY('+(40+76*(1-lv))+'px)';if(t)t.textContent=S.fills.length?tr(f1(b)+' л'):'—';if(r)r.textContent=tr('⛽ −'+f1(g.lph)+' л/ч'+(S.fills.length?' · ~'+f1(b/(g.lph||1))+' ч':''))}
setInterval(flowTick,1000);

initNativeApp();syncNativeReminders();render();
</script>
</body>

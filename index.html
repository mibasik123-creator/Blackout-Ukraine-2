<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Блекаут: генератор и станции</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--ac:#e8730c;--ok:#2e8b57;--bad:#c0392b;--bd:#e2e2dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--card:#222220;--tx:#f0f0ec;--mut:#9a9a94;--bd:#33332f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151514;--card:#222220;--tx:#f0f0ec;--mut:#9a9a94;--bd:#33332f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
main{max-width:520px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px;color:var(--mut);font-weight:600}
select,input{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.row{display:flex;gap:8px}.row>*{flex:1}
button{font:inherit;border:0;border-radius:12px;padding:12px 14px;background:var(--ac);color:#fff;font-weight:600;width:100%;margin-top:10px}
button.big{padding:22px;font-size:20px}button.go{background:var(--ok)}button.stop{background:var(--bad)}
button.sec{background:var(--bd);color:var(--tx)}button.sm{width:auto;padding:6px 10px;margin:0;font-size:13px}
.tm{font-size:40px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.mut{color:var(--mut);font-size:13px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok)}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bd)}.kv:last-child{border:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{margin:0;border-radius:0;background:none;color:var(--mut);padding:14px 4px;font-size:13px}
nav button.on{color:var(--ac)}
.h{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
textarea{width:100%;height:110px;font-size:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
body{background-image:radial-gradient(circle at 12% 0%,rgba(232,115,12,.2),transparent 45%),radial-gradient(circle at 95% 100%,rgba(46,139,87,.16),transparent 42%);background-attachment:fixed;background-repeat:no-repeat}
html{scroll-behavior:smooth}
.card{box-shadow:0 2px 10px rgba(0,0,0,.05)}
main.anim .card{animation:in .38s cubic-bezier(.2,.8,.2,1) both}
main.anim .card:nth-child(2){animation-delay:.05s}main.anim .card:nth-child(3){animation-delay:.1s}main.anim .card:nth-child(4){animation-delay:.15s}
@keyframes in{from{opacity:0;transform:translate(var(--dx,0px),10px)}to{opacity:1;transform:none}}
button{transition:transform .12s,opacity .2s,filter .2s,color .2s}button:active{transform:scale(.96);filter:brightness(.92)}
.bar i{transition:width .6s ease}
.tm.run{color:var(--ok);animation:pl 2s ease-in-out infinite}@keyframes pl{50%{opacity:.65}}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#222;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.3s;font-size:14px;z-index:30}#toast.on{opacity:1;transform:translate(-50%,0)}
#md{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;padding:20px}#md.on{opacity:1;pointer-events:auto}
.mb{background:var(--card);border-radius:16px;padding:18px;max-width:340px;width:100%;transform:scale(.94);transition:transform .2s}#md.on .mb{transform:none}
main.anim>*{animation:in .45s cubic-bezier(.2,.8,.2,1) both}main.anim>:nth-child(2){animation-delay:.06s}main.anim>:nth-child(3){animation-delay:.12s}main.anim>:nth-child(4){animation-delay:.18s}main.anim>:nth-child(5){animation-delay:.24s}main.anim>:nth-child(6){animation-delay:.3s}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 20% 25%,rgba(232,115,12,.16),transparent 40%),radial-gradient(circle at 80% 70%,rgba(46,139,87,.14),transparent 40%);animation:drift 22s ease-in-out infinite alternate}@keyframes drift{to{transform:translate(6%,4%) scale(1.12)}}
.hero{padding:6px 4px 14px}.hero .hi{color:var(--mut);font-size:14px}.hero .ttl{font-size:32px;font-weight:800;letter-spacing:-.5px;margin:2px 0 10px;background:linear-gradient(90deg,var(--ac),#f5b400);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:20px;background:var(--card);border:1px solid var(--bd);font-size:13px}.pill i{width:8px;height:8px;border-radius:50%;background:var(--mut)}.pill.on i{background:var(--ok);animation:dot 1.4s infinite}@keyframes dot{0%{box-shadow:0 0 0 0 rgba(46,139,87,.6)}100%{box-shadow:0 0 0 10px rgba(46,139,87,0)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stats div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 4px;text-align:center}.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.stats span{font-size:11px;color:var(--mut)}
.pc{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.05);transition:box-shadow .4s,border-color .4s}.pc.on{border-color:var(--ok);box-shadow:0 0 0 3px rgba(46,139,87,.15),0 8px 24px rgba(46,139,87,.22)}
.pwrap{position:relative;width:112px;height:112px;flex:0 0 112px;display:flex;align-items:center;justify-content:center}
.pw{position:relative;width:92px;height:92px;border-radius:50%;margin:0;padding:0;display:flex;align-items:center;justify-content:center;background:var(--bd);color:var(--mut)}.pw.on{background:linear-gradient(145deg,#3aa56a,#2e8b57);color:#fff;box-shadow:0 6px 18px rgba(46,139,87,.45)}
.pw .ring{position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--ok);opacity:0;pointer-events:none}.pw.on .ring{animation:rg 1.8s ease-out infinite}@keyframes rg{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.25);opacity:0}}
.gz{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}.gb{fill:none;stroke:var(--bd);stroke-width:5}.gf{fill:none;stroke:var(--ac);stroke-width:5;stroke-linecap:round;animation:gfill 1.2s ease}@keyframes gfill{from{stroke-dashoffset:289}}
.pi{flex:1;min-width:0}.pn{font-weight:600;font-size:15px}.pt{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0}.pi select,.pi input{padding:8px;font-size:14px;margin-top:4px}
.bar i{transform-origin:left;animation:gr .9s ease}@keyframes gr{from{transform:scaleX(0)}}
.card{border-radius:20px;padding:16px}.card h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px}.card h2::before{content:"";width:4px;height:14px;border-radius:2px;background:linear-gradient(var(--ac),#f5b400)}
.kv{border:0;background:var(--bg);border-radius:12px;padding:9px 12px;margin:5px 0}select,input,textarea{border-radius:12px}
button:not(.sec):not(.stop):not(.go):not(.pw):not(.sm){background:linear-gradient(145deg,var(--ac),#f5a000);box-shadow:0 4px 14px rgba(232,115,12,.28)}
button.go{background:linear-gradient(145deg,#3aa56a,#2e8b57)!important;box-shadow:0 6px 18px rgba(46,139,87,.4)}button.stop{background:linear-gradient(145deg,#d9534f,#c0392b)!important;box-shadow:0 6px 18px rgba(192,57,43,.35)}button.big{border-radius:18px}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-bottom:0;border:1px solid var(--bd);border-radius:22px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 8px 28px rgba(0,0,0,.15);overflow:hidden}
nav button{background:none!important;box-shadow:none!important}nav button.on{background:rgba(232,115,12,.14)!important;border-radius:16px}body{padding-bottom:110px}
.gh{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.rc{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:6px 6px 6px 14px;margin-top:10px}.rc span{color:var(--mut);font-size:15px}.rc input{width:auto;flex:1;min-width:0;border:0;background:transparent;padding:8px 4px;font-size:20px;font-weight:600}.rc input:focus{outline:none}.rc button{width:52px;height:46px;margin:0;padding:0;border-radius:12px;font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chips button{margin:0}.chips button.on{background:linear-gradient(145deg,var(--ac),#f5a000)!important;color:#fff}
#nb{display:flex;flex:1;position:relative;z-index:1}#ind{position:absolute;top:5px;bottom:5px;left:0;width:20%;border-radius:16px;background:rgba(232,115,12,.16);transition:transform .45s cubic-bezier(.3,1.35,.5,1)}nav button.on{background:none!important}
.hero .ttl{background-image:linear-gradient(90deg,var(--ac),#f5b400,var(--ac));background-size:200% 100%;animation:sh 5s linear infinite}@keyframes sh{to{background-position:200% 0}}
button:not(.pw){position:relative;overflow:hidden}.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}@keyframes rp{to{transform:scale(1);opacity:0}}
#md.on .mb{animation:pop .4s cubic-bezier(.3,1.5,.5,1)}@keyframes pop{from{transform:scale(.8);opacity:0}}
.pw.on{animation:pop2 .6s cubic-bezier(.3,1.5,.5,1)}@keyframes pop2{0%{transform:scale(.8)}100%{transform:scale(1)}}
.h{animation:in2 .3s ease both}@keyframes in2{from{opacity:0;transform:translateY(8px)}}
#spl{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:80px;pointer-events:none;animation:spl .5s ease .9s forwards}#spl span{animation:bolt .9s cubic-bezier(.3,1.4,.5,1)}@keyframes spl{to{opacity:0;visibility:hidden}}@keyframes bolt{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:scale(1);opacity:1}}.pwrap.sm{width:76px;height:76px;flex:0 0 76px}.gp{position:relative;font-weight:700;font-size:15px}
nav button{font-size:12px;padding:14px 2px}#md.solo .sec{display:none}
@media (prefers-reduced-motion:reduce){#spl{display:none}*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"><div id="ind"></div><div id="nb"></div></nav>
<div id="spl"><span>⚡</span></div>
<div id="toast"></div>
<div id="md"><div class="mb"><p id="mt" style="margin:0 0 6px;font-size:17px"></p><div class="row"><button class="sec" id="mcn" onclick="askOk(0)">Отмена</button><button class="stop" id="mok" onclick="askOk(1)">Да</button></div></div></div>
<script>
var KEY='blackout_v1',tab='pan';
function def(){return{gens:[{n:'FORTE FG6500',lph:1.8,svc:50,h:0,last:0}],g:0,run:null,ses:[],sts:[{n:'Fossibot F2400',wh:2048},{n:'Fossibot F1800 (2026)',wh:1536}],logs:[],price:0}}
var S=load();S.locs=S.locs||['Дом'];S.users=S.users||['Я'];S.loc=S.loc||0;S.usr=S.usr||0;S.gps=S.gps||{};S.tar=S.tar||0;S.fills=S.fills||[];S.remInt=S.remInt||0;S.rem=S.rem||null;S.srun=S.srun||null;if(!S.lang){S.lang='uk';if(S.locs.length==1&&S.locs[0]=='Дом')S.locs[0]='Дім'}
function load(){try{var j=localStorage.getItem(KEY);if(j)return JSON.parse(j)}catch(e){}return def()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function f1(x){return (Math.round(x*10)/10).toString().replace('.',',')}
function dt(t){return new Date(t).toLocaleString(LOC(),{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function dur(ms){var s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);s%=60;return h+':'+('0'+m).slice(-2)+':'+('0'+s).slice(-2)}
var TABS=['pan','gen','st','hist','set'];var tf=1;function setTab(t){var o=TABS.indexOf(tab),n=TABS.indexOf(t);document.getElementById('app').style.setProperty('--dx',((n>o)-(n<o))*28+'px');tab=t;tf=1;window.scrollTo(0,0);render()}
function render(){
 var tabs=[['pan','Панель'],['gen','Генератор'],['st','Станции'],['hist','История'],['set','Настройки']];
 document.getElementById('ind').style.transform='translateX('+(tab=='cat'?4:Math.max(0,TABS.indexOf(tab)))*100+'%)';document.getElementById('nb').innerHTML=tabs.map(function(t){return '<button class="'+(t[0]==tab?'on':'')+'" onclick="setTab(\''+t[0]+'\')" style="flex:1">'+tr(t[1])+'</button>'}).join('');
 var ap=document.getElementById('app');ap.classList.remove('anim');ap.innerHTML=tr((tab=='pan'?'':heroH(tab))+{pan:vPan,gen:vGen,st:vSt,hist:vHist,set:vSet,cat:vCat}[tab]());document.documentElement.lang=S.lang||'uk';document.getElementById('mcn').textContent={uk:'Скасувати',en:'Cancel',ru:'Отмена'}[S.lang||'uk'];if(tf){void ap.offsetWidth;ap.classList.add('anim');tf=0;cu()}
}
function vGen(){
 var g=S.gens[S.g]||S.gens[0],left=g.last+g.svc-g.h,pct=Math.max(0,Math.min(100,left/g.svc*100));
 var opts=S.gens.map(function(x,i){return '<option value="'+i+'"'+(i==S.g?' selected':'')+'>'+esc(x.n)+'</option>'}).join('');
 var h='<div class="card"><h2>Модель</h2><select onchange="S.g=+this.value;save();render()">'+opts+'</select>'+sel2()+(g.p?'<img src="'+g.p+'" style="width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-top:10px">':'');
 h+='<div class="tm'+(S.run?' run':'')+'" id="tm">'+(S.run?dur(Date.now()-S.run):'0:00:00')+'</div>';
 if(S.run){h+='<div class="mut" style="text-align:center">Включён в '+dt(S.run)+'</div><label>Фактический расход, л (необязательно)</label><input id="fa" type="number" step="0.1" inputmode="decimal"><button class="big stop" onclick="stopG()">Остановить</button>'}
 else h+='<button class="big go" onclick="startG()">Запустить</button>';
 h+='</div>'+fuelCard(g)+'<div class="card"><h2>Моточасы и ТО</h2><div class="kv"><span>Наработка</span><b>'+f1(g.h)+' ч</b></div><div class="kv"><span>До ТО</span><b style="color:'+(left<=5?'var(--bad)':'inherit')+'">'+f1(left)+' ч</b></div><div class="bar"><i style="width:'+pct+'%;background:'+(left<=5?'var(--bad)':'var(--ok)')+'"></i></div>';
 if(left<=5)h+='<div class="mut">⚠ Пора на обслуживание: масло, свеча, воздушный фильтр.</div>';
 h+='<button class="sec" onclick="doSvc()">ТО выполнено</button></div>';
 var tf=0,th=0;S.ses.forEach(function(s){tf+=s.f;th+=s.h});
 h+='<div class="card"><h2>Всего за всё время</h2><div class="kv"><span>Сессий</span><b>'+S.ses.length+'</b></div><div class="kv"><span>Время работы</span><b>'+f1(th)+' ч</b></div><div class="kv"><span>Топливо</span><b>'+f1(tf)+' л</b></div>'+(S.price>0?'<div class="kv"><span>Стоимость</span><b>'+Math.round(tf*S.price)+' ₴</b></div>':'')+'</div>';
 return h;
}
function startG(){S.run=Date.now();S.remN=0;S.lowW=0;save();render()}
function stopG(){
 var g=S.gens[S.g],end=Date.now(),h=(end-S.run)/3600000,fa=parseFloat((document.getElementById('fa')||{}).value),est=!(fa>0);
 var f=est?h*g.lph:fa;
 S.ses.push({id:end,g:g.n,s:S.run,e:end,h:h,f:f,est:est,loc:S.locs[S.loc],u:S.users[S.usr]});g.h+=h;S.run=null;save();render();
}
function doSvc(){var g=S.gens[S.g];ask('Отметить ТО на '+f1(g.h)+' ч?',function(){g.last=g.h;save();render();toast('ТО отмечено')})}
setInterval(tick,1000);

var si=0;
function vSt(){
 var o=S.sts.map(function(x,i){return '<option value="'+i+'"'+(i==si?' selected':'')+'>'+esc(x.n)+'</option>'}).join('');
 var h='<div class="card"><h2>Новая запись</h2><select onchange="si=+this.value;render()">'+o+'</select>'+sel2();
 h+='<div class="row"><div><label>Было, %</label><input id="p1" type="number" inputmode="decimal" min="0" max="100"></div><div><label>Стало, %</label><input id="p2" type="number" inputmode="decimal" min="0" max="100"></div></div>';
 h+='<label>Источник заряда</label><select id="src"><option value="grid">Сеть</option><option value="gen">Генератор</option><option value="sun">Солнце</option></select><label>или сразу Вт·ч (необязательно)</label><input id="wh" type="number" inputmode="decimal"><div class="row"><button class="go" onclick="addSt(1)">Заряд</button><button onclick="addSt(0)">Разряд</button></div><div class="mut" style="margin-top:8px">Вт·ч считается как разница процентов × ёмкость. Тип записи выбирается кнопкой.</div></div>';
 h+=rtCard();
 S.sts.forEach(function(s,i){
  var c=0,d=0,gr=0,last=null;S.logs.forEach(function(l){if(l.i==i){if(l.c){c+=l.wh;if(!l.src||l.src=='grid'||l.src=='Сеть')gr+=l.wh}else d+=l.wh;last=l.p2}});
  h+='<div class="card"><div class="gh"><div class="pwrap sm"><svg class="gz" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" class="gb"/><circle cx="50" cy="50" r="44" class="gf" style="stroke-dasharray:276;stroke-dashoffset:'+(276*(1-Math.max(0,Math.min(100,last||0))/100))+'"/></svg><span class="gp">'+(last==null?'—':Math.round(last)+'%')+'</span></div><div><div class="pn">'+esc(s.n)+'</div><div class="mut">'+s.wh+' Вт·ч</div></div></div>'+(s.p?'<img src="'+s.p+'" style="width:100%;max-height:160px;object-fit:cover;border-radius:12px;margin-bottom:8px">':'')+'<div class="kv"><span>Заряжено</span><b>'+f1(c/1000)+' кВт·ч</b></div>'+(S.tar>0?'<div class="kv"><span>Из сети, стоимость</span><b>'+f1(gr/1000*S.tar)+' ₴</b></div>':'')+'<div class="kv"><span>Отдано нагрузке</span><b>'+f1(d/1000)+' кВт·ч</b></div><div class="kv"><span>Последний уровень</span><b>'+(last==null?'—':f1(last)+' %')+'</b></div></div>';
 });
 return h;
}
function addSt(c){
 var s=S.sts[si];if(!s)return;var p1=parseFloat(document.getElementById('p1').value),p2=parseFloat(document.getElementById('p2').value),w=parseFloat(document.getElementById('wh').value);
 if(!(w>0)){if(isNaN(p1)||isNaN(p2))return toast('Введите проценты или Вт·ч');w=Math.abs(p2-p1)/100*s.wh}
 S.logs.push({id:Date.now(),i:si,c:c,wh:w,p1:isNaN(p1)?null:p1,p2:isNaN(p2)?null:p2,t:Date.now(),loc:S.locs[S.loc],u:S.users[S.usr],src:c?document.getElementById('src').value:''});save();render();
}

function vHist(){
 var items=[];
 S.ses.forEach(function(s){items.push({t:s.s,k:'s',id:s.id,x:'⚙ '+esc(s.g)+': '+dt(s.s)+' → '+dt(s.e).slice(-5)+', '+f1(s.h)+' ч, '+f1(s.f)+' л'+(s.est?' (расчёт)':'')+tag(s)})});
 S.logs.forEach(function(l){items.push({t:l.t,k:'l',id:l.id,x:'🔋 '+esc(S.sts[l.i]?S.sts[l.i].n:'?')+': '+(l.c?'заряд'+(l.src?' ('+({grid:'Сеть',gen:'Генератор',sun:'Солнце'}[l.src]||l.src)+') ':' '):'разряд ')+Math.round(l.wh)+' Вт·ч, '+dt(l.t)+(l.dur?' · '+dur(l.dur):'')+tag(l)})});
 S.fills.forEach(function(f){items.push({t:f.t,k:'f',id:f.id,x:'⛽ '+esc(f.g)+': +'+f1(f.l)+' л, '+dt(f.t)})});
 items.sort(function(a,b){return b.t-a.t});

function expB(){var o=JSON.parse(JSON.stringify(S));o.gens.forEach(function(x){delete x.p});o.sts.forEach(function(x){delete x.p});document.getElementById('bk').value=JSON.stringify(o)}

function impB(){var t=document.getElementById('bk').value;ask('Заменить все текущие данные данными из копии?',function(){try{var o=JSON.parse(t);if(!o.gens||!o.gens.length||!o.sts)throw 0;var ph0={};S.gens.concat(S.sts).forEach(function(x){if(x.p)ph0[x.n]=x.p});o.gens.concat(o.sts).forEach(function(x){if(!x.p&&ph0[x.n])x.p=ph0[x.n]});S=o;S.locs=S.locs||['Дом'];S.users=S.users||['Я'];S.loc=S.usr=S.g=0;S.gps=S.gps||{};S.tar=S.tar||0;S.fills=S.fills||[];S.ses=S.ses||[];S.logs=S.logs||[];S.run=null;S.srun=null;S.rem=null;S.remInt=S.remInt||0;si=0;save();render();toast('Восстановлено')}catch(e){toast('Неверные данные')}})}
function ph(a,i){var o=S[a][i];return '<div class="row" style="align-items:center;margin-top:8px"><div style="flex:0 0 60px">'+(o.p?'<img src="'+o.p+'" style="width:60px;height:60px;object-fit:cover;border-radius:10px">':'<div style="width:60px;height:60px;border-radius:10px;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:26px">'+(a=='gens'?'⚙':'🔋')+'</div>')+'</div><button class="sec sm" onclick="pick(\''+a+'\','+i+')">📷 Фото</button><button class="sec sm" onclick="delX(\''+a+'\','+i+')">🗑 Удалить</button></div>'}
function pick(a,i){var f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=function(){if(!f.files[0])return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,360/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);S[a][i].p=c.toDataURL('image/jpeg',0.7);save();render()};im.src=r.result};r.readAsDataURL(f.files[0])};f.click()}
function delX(a,i){if(a=='gens'){if(S.gens.length<2)return toast('Нужен хотя бы один генератор');ask('Удалить генератор? История запусков останется.',function(){S.gens.splice(i,1);S.g=0;save();render();toast('Удалено')})}else{ask('Удалить станцию вместе с её записями?',function(){S.sts.splice(i,1);S.logs=S.logs.filter(function(l){return l.i!=i}).map(function(l){if(l.i>i)l.i--;return l});si=0;save();render();toast('Удалено')})}}
function chips(){var a=ck=='g'?CG:CS,b=[''];a.forEach(function(m){var w=m[0].split(' ')[0];if(b.indexOf(w)<0)b.push(w)});return b.map(function(w){return '<button class="sec sm'+(cq==w?' on':'')+'" onclick="cq=\''+w+'\';render()">'+(w||'Все')+'</button>'}).join('')}
function glph(m){return Math.round(m[1]*(m[2]?0.28:0.33)*10)/10}
function vCat(){return '<div class="card"><h2>Каталог моделей</h2><div class="row"><button class="'+(ck=='g'?'':'sec')+'" onclick="ck=\'g\';render()">Генераторы</button><button class="'+(ck=='s'?'':'sec')+'" onclick="ck=\'s\';render()">Станции</button></div>'+(ck=='g'?'<label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" style="width:auto" '+(ci?'checked':'')+' onchange="ci=this.checked;cl()">Только инверторные</label>':'')+'<input placeholder="Поиск: бренд или модель" value="'+esc(cq)+'" oninput="cq=this.value;cl()" style="margin-top:10px"><div class="chips">'+chips()+'</div><div id="cl">'+cl(1)+'</div><div class="mut" style="margin-top:8px">Емкость станций и год выпуска приблизительные. Расход генератора — оценка при ~75% нагрузки по номинальной мощности: после первых заправок поправьте по факту в «Настройках». ТО по умолчанию каждые 50 ч, уточните по инструкции.</div><button class="sec" onclick="setTab(\'set\')">← В настройки</button></div>'}
function cl(r){var a=ck=='g'?CG:CS,q=cq.toLowerCase(),have=(ck=='g'?S.gens:S.sts).map(function(x){return x.n}),h=a.map(function(m,i){return[m,i]}).filter(function(x){return x[0][0].toLowerCase().indexOf(q)>=0&&(!ci||ck!='g'||x[0][2])}).map(function(x){var m=x[0],d=have.indexOf(m[0])>=0;return '<div class="h"><span>'+esc(m[0])+'<br><span class="mut">'+(ck=='g'?m[1]+' кВт, ~'+f1(glph(m))+' л/ч'+(m[2]?', инвертор':''):m[1]+' Вт·ч, ~'+m[2]+' г.')+'</span></span><button class="sm'+(d?' sec" disabled':'"')+' onclick="addC('+x[1]+')">'+(d?'✓':'+')+'</button></div>'}).join('');if(r)return h;document.getElementById('cl').innerHTML=tr(h)}
function addC(i){if(ck=='g'){var m=CG[i];S.gens.push({n:m[0],lph:glph(m),svc:50,h:0,last:0})}else{var s=CS[i];S.sts.push({n:s[0],wh:s[1]})}save();cl()}
function doImp(){var n=0;document.getElementById('imp').value.split('\n').forEach(function(l){var p=l.split(';').map(function(x){return x.trim()});if(p[0]=='g'&&p[1]){S.gens.push({n:p[1],lph:parseFloat(p[2])||1.5,svc:parseFloat(p[3])||50,h:0,last:0});n++}else if(p[0]=='s'&&p[1]){S.sts.push({n:p[1],wh:parseFloat(p[2])||1000});n++}});save();toast('Добавлено: '+n);render()}
render();
</script>

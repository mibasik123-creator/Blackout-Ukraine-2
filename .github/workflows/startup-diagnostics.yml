name: BLACKOUT startup diagnostics APK
on:
  workflow_dispatch:
  push:
    branches:
      - fix/startup-diagnostics
      - fix/settings-button-motion
    paths:
      - index.html
      - .github/workflows/startup-diagnostics.yml
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          html = open('index.html', encoding='utf-8').read()
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, re.S | re.I)
          assert scripts, 'No inline script found'
          open('/tmp/blackout.js', 'w', encoding='utf-8').write(scripts[-1])
          PY
          node --check /tmp/blackout.js
      - name: Prepare project
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/bluetooth-le@6 @capacitor/geolocation@6 @capacitor/app@6 @capacitor/local-notifications@6
          echo '{"appId":"com.blackout.log","appName":"Blackout","webDir":"www"}' > capacitor.config.json
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: blackout-startup-diagnostics
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

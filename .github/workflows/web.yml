name: Publish web version (iPhone / Safari)
on:
  workflow_dispatch:
  push:
    branches: ["design/**", main]
    paths: [index.html, web/**, .github/workflows/web.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir site
          cp web/manifest.webmanifest web/sw.js site/
          cp brand/icon-512.png brand/icon-1024.png site/
          python3 - <<'PY'
          h=open('index.html',encoding='utf-8').read()
          add=('<link rel="manifest" href="manifest.webmanifest">'
               '<link rel="apple-touch-icon" href="icon-512.png">'
               '<meta name="apple-mobile-web-app-capable" content="yes">'
               '<meta name="mobile-web-app-capable" content="yes">'
               '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">'
               '<meta name="apple-mobile-web-app-title" content="Blackout">')
          i=h.index('<head>')+len('<head>')
          h=h[:i]+add+h[i:]
          reg='<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>'
          h=h.replace('</body>',reg+'</body>',1)
          open('site/index.html','w',encoding='utf-8').write(h)
          PY
          touch site/.nojekyll
      - name: Push to gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "web build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, "test/**", "design/**"]
    paths: [index.html, .github/workflows/android.yml]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          h = open('index.html', encoding='utf-8').read()
          s = re.findall(r'<script[^>]*>(.*?)</script>', h, re.S | re.I)
          assert s, 'No inline script found'
          open('/tmp/blackout.js', 'w', encoding='utf-8').write(s[-1])
          PY
          node --check /tmp/blackout.js
      - name: Prepare project
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/bluetooth-le@6 @capacitor/geolocation@6 @capacitor/app@6 @capacitor/local-notifications@6 @capacitor-community/keep-awake@5
          echo '{"appId":"com.blackout.log","appName":"Blackout","webDir":"www"}' > capacitor.config.json
      - run: npx cap add android
      - run: npx cap sync android
      - name: Use fixed signing key (APK updates install over the old one, data is kept)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Fixed signing key + increasing version (updates install over the old app)
        run: |
          cat >> android/app/build.gradle <<'EOF2'

          android {
              signingConfigs {
                  fixed {
                      storeFile file("${rootDir}/../debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes { debug { signingConfig signingConfigs.fixed } }
              defaultConfig {
                  versionCode ${{ github.run_number }}
                  versionName "3.4.${{ github.run_number }}"
              }
          }
          EOF2
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Show APK signing certificate
        run: |
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $ANDROID_HOME/build-tools/$BT/apksigner verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: blackout-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
